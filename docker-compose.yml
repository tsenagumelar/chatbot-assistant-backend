services:
  chatbot-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: taufansena/chatbot-backend:latest
    container_name: police-assistant-backend
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - PORT=48080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:48080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
