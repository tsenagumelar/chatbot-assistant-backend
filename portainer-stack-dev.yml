version: "3.8"

services:
  chatbot-backend:
    image: taufansena/chatbot-backend:latest
    container_name: police-assistant-backend
    restart: unless-stopped
    network_mode: host
    environment:
      - PORT=48080
      - OPENAI_API_KEY=
      - ORS_API_KEY=
      - OPENAI_MODEL=gpt-4o-mini
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:48080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
